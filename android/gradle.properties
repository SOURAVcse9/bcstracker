org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
android.useAndroidX=true
android.enableJetifier=true

# Fix for the "this and base files have different roots" Kotlin daemon crash
# that happens on Windows when the project folder and the Gradle/Pub cache
# live on different drive letters (e.g. project on E:, caches on C:).
# Disabling Kotlin incremental compilation avoids the cross-drive relative
# path bug entirely. The main recommended fix is still to move the project
# folder onto the same drive as your user profile (usually C:) - see README.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
